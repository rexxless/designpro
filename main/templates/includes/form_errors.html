{% if form.errors %}
    <div class="form-errors" role="alert">
        {% for field in form %}
            {% if field.errors %}
                <div id="{{ field.auto_id }}_error">
                    {% for error in field.errors %}
                        <p>{{ field.label }} — {{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endfor %}
        {% for error in form.non_field_errors %}
            <p>{{ error }}</p>
        {% endfor %}
    </div>
{% endif %}
