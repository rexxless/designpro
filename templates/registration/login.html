{% extends "base_generic.html" %}

{% block title %}Вход · Design.pro{% endblock %}

{% block content %}
<section class="panel form-panel" aria-labelledby="login-heading">
    <h1 id="login-heading">Вход в личный кабинет</h1>
    <form method="post" action="{% url 'login' %}" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="actions">
            <button class="portal-button" type="submit">Войти</button>
        </div>
    </form>
    {% include "includes/form_errors.html" %}
    <div class="form-footer actions">
        <a href="{% url 'register' %}">Зарегистрироваться</a>
    </div>
</section>
{% endblock %}
