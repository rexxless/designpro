{% extends "base_generic.html" %}

{% block title %}Регистрация · Design.pro{% endblock %}

{% block content %}
<section class="panel form-panel" aria-labelledby="register-heading">
    <h1 id="register-heading">Регистрация</h1>
    <form method="post" action="{% url 'register' %}" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="actions">
            <button class="portal-button" type="submit">Создать аккаунт</button>
        </div>
    </form>
    {% include "includes/form_errors.html" %}
    <p class="form-footer">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</section>
{% endblock %}
