{% extends "base_generic.html" %}

{% block title %}Reset password · Design.pro{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card auth-card mx-auto border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 fw-bold mb-1">Forgot your password?</h1>
      <p class="text-body-secondary mb-4">Enter your email and we'll send you a reset link.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-brand w-100 py-2">Send reset link</button>
      </form>
      <p class="text-center small mt-4 mb-0"><a href="{% url 'login' %}" class="link-secondary">Back to log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
